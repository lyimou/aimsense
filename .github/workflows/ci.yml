name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both versions, deliberately. `i18n.js` read a global `navigator` at
        # module load, which does not exist on Node 20 (it arrived in Node 21).
        # That crashed every module importing it — including the engine — and
        # was invisible locally on Node 24. Cheap insurance against the same
        # class of runtime-specific break.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: npm test

      # Dependency freedom is asserted inside the test suite
      # (scripts/test-deps.mjs), so it runs on both Node versions rather than
      # once. It used to be a standalone step ending in a grep for bare module
      # specifiers, and that grep was matched by ordinary PROSE: a comment in
      # engine.js reads 'could not tell "flew past" from "stopped short"', and
      # `from "flew past"` looks exactly like `from "lodash"` to a regex. It
      # failed CI on both Node versions because of a sentence. The check now
      # parses import statements, and test-deps.mjs asserts that the parser
      # flags a real bare import while ignoring prose.

      - name: Check every module parses
        run: |
          fail=0
          for f in src/js/*.js scripts/test-*.mjs; do
            if node --check "$f" 2>/dev/null; then
              echo "ok   $f"
            else
              echo "::error file=$f::syntax error"
              fail=1
            fi
          done
          exit $fail

      - name: Verify no third-party network requests on load
        run: |
          # A CDN font or script would break offline use and leak requests.
          if grep -nE 'https?://[^"]*\.(js|css|woff2?|ttf)' index.html src/css/styles.css; then
            echo "::error::a third-party asset URL was found"
            exit 1
          fi
          echo "no third-party assets referenced"

      - name: Ensure no absolute URLs in asset references
        run: |
          # Relative paths are what let this deploy to /aimsense/ with no base
          # configuration. An absolute src/href would break the subpath deploy.
          if grep -nE '(src|href)="/(src|favicon)' index.html; then
            echo "::error::index.html uses root-absolute asset paths"
            exit 1
          fi
          echo "asset paths are relative"

      - name: Verify the deploy output is complete
        run: |
          # Catches the failure mode where the page references a file that was
          # never staged: a 404 in production and a blank screen. Run here, on
          # every push and PR, rather than only discovering it at deploy time.
          node scripts/stage-deploy.mjs
          rm -rf _site

      - name: Verify translation coverage
        run: |
          # A missing translation renders as the raw key and a placeholder that
          # exists in one language but not the other silently drops data from
          # the sentence. Neither throws, so both are asserted here.
          node scripts/test-i18n.mjs

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/configure-pages@v5

      # Stage an explicit allowlist of published files. Uploading `path: .`
      # would publish the whole repository, including internal CI config,
      # the test harness and ~1 MB of dev screenshots.
      - name: Stage the deploy output
        run: node scripts/stage-deploy.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          # Only the staged allowlist, never the repository root.
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
